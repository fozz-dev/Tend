    case 'edit-steps':ui.edit.has(t)?ui.edit.delete(t):ui.edit.add(t);render();break;
    case 'up':{const k=task(),i=k.steps.findIndex(x=>x.id===s);if(i>0){[k.steps[i-1],k.steps[i]]=[k.steps[i],k.steps[i-1]];save();render()}break}
    case 'rm-step':{const k=task();{const x=k.steps.find(y=>y.id===s);taskEst(k);if(x&&!x.done)k.estMin=Math.max(5,k.estMin-(x.minutes||10))}k.steps=k.steps.filter(x=>x.id!==s);if(!k.steps.length)ui.edit.delete(t);const r=checkTaskComplete(k);save();render();if(r.done){confettiAt(innerWidth/2,innerHeight*.4,26);toast(`Finished “${k.title}”!`);afterProgress()}break}
    case 'edit-task':taskSheet(t);break;
    case 'kind':ui.hobbyKind=el.dataset.k;ui.anim=true;render();break;
    case 'edit-hobby':hobbySheet(id);break;
    case 'add-hobby':if(el.dataset.k)ui.hobbyKind=el.dataset.k;hobbySheet(null);break;
    case 'did':didHobby(id);break;
    case 'undol':undoLedger(id);break;
    case 'donetoggle':ui.dtOpen=!ui.dtOpen;render();break;
    case 'redeem':redeemSheet(id);break;
    case 'edit-reward':rewardSheet(id);break;
    case 'add-reward':rewardSheet(null);break;
    case 'shoptab':ui.shopTab=el.dataset.k;ui.anim=true;render();break;
    case 'colpick':colPick(el.dataset.k,el.dataset.id);break;
    case 'stepbell':{const tt=S.tasks.find(x=>x.id===el.dataset.t),ss=tt&&tt.steps.find(x=>x.id===el.dataset.s);if(!ss)break;openSheet(`<h1 style="font-size:24px">🔔 ${esc(ss.title)}</h1><p class="sub">${ss.at?'Planned '+esc(atLabel(ss.at)||'')+'.':'Not planned yet: the reminder starts once it has a time.'}</p><div class="lbl">Remind me</div>${remSelectHTML('sbR',ss.remind,true)}<button class="btn mauve block mt" data-ok>Save</button>`,el2=>{bindRemSel(el2,'sbR');el2.onclick=e=>{const b=btnOf(e);if(b&&b.hasAttribute('data-ok')){ss.remind=remRead(el2,'sbR');save();closeSheet();render();toast(ss.remind?'Reminder set':'Uses the task’s reminder')}}})}break;
    case 'steptimer':{const tt=S.tasks.find(x=>x.id===el.dataset.t),ss=tt&&tt.steps.find(x=>x.id===el.dataset.s);if(ss)timerSheet(ss.title,ss.minutes||10,()=>completeStep(tt.id,ss.id))}break;
    case 'slot':ui.slot=el.dataset.k;ui.anim=true;render();break;
    case 'item':itemSheet(id);break;
    case 'wear':{if(wearing(id))unequip(id);else equip(id);save();render();pipHop();break}
    case 'undress':S.wardrobe.equipped={};save();render();break;
    case 'backup-now':DL?doDownload():doCopy();break;
    case 'snooze':S.settings.nudgeSnooze=Date.now()+DAY;save();render();break;
  }
});
function focusStep(tid){setTimeout(()=>{const i=document.querySelector(`form[data-t="${tid}"] input`);if(i)i.focus()},30)}
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.form==='qpin'){const i=f.querySelector('input');if(qHash(i.value.trim())===S.quit.pin){quitOpen=true;ui.anim=true;render()}else{i.value='';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');toast('That PIN didn’t match')}return}
  if(f.dataset.form==='task'){const v=f.querySelector('input').value.trim();if(!v)return;
    const vw=ui.tview||'today',t={id:uid(),title:v,energy:'medium',today:vw==='today',when:vw==='someday'?'someday':'anytime',date:vw==='upcoming'?addDays(dkey(),1):null,area:ui.area||guessArea(v),createdAt:Date.now(),done:false,steps:[]};S.tasks.push(t);ui.open.add(t.id);save();render();focusStep(t.id);
    const sh=splitShop(v);if(sh.length&&!/\b(phone|parcel|package|keys|prescription|ticket)\b/i.test(v))setTimeout(()=>toast(`Add ${sh.join(', ')} to your shopping list?`,'Add',()=>{const n=addShopping(sh,t.id);save();toast(`${n} added to Shopping list`)}),400)}
  else if(f.dataset.form==='shop'){const i=f.querySelector('input'),v=i.value.trim();if(!v)return;addShopping(v.split(/,/),null);save();render();setTimeout(()=>{const x=document.querySelector('[data-form=shop] input');if(x)x.focus()},30)}
  else if(f.dataset.form==='step'){const tid=f.dataset.t,v=f.querySelector('input').value.trim();if(!v)return;
    const m=+f.querySelector('select').value;ui.lastMin=m;const k=S.tasks.find(x=>x.id===tid);if(!k)return;
    taskEst(k);k.estMin+=m||10;k.steps.push({id:uid(),title:v,minutes:m||null,done:false});if(k.done){k.done=false;k.doneAt=null}save();render();focusStep(tid)}
});
document.addEventListener('input',e=>{if(e.target.id==='recQ'){ui.rf.q=e.target.value;render();const x=$('#recQ');if(x){x.focus();const n=x.value.length;try{x.setSelectionRange(n,n)}catch(_){}}return}if(e.target.id==='libQ'){ui.libQ=e.target.value;const r=$('#libRes'),g=$('#libGrid');if(r)r.innerHTML=libSearch(ui.libQ);if(g)g.hidden=!!ui.libQ.trim()}});
function maybePromptCheckin(){if(OB||TOUR)return;if(!todayCheckin()&&lsGet('tend.skip')!==dkey()&&!$('#sheet').classList.contains('on')&&!cOpen)checkinSheet()}
let lastDay=dkey();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(dkey()!==lastDay){lastDay=dkey();ui.pick=0;ui.jf=0}render();setTimeout(maybePromptCheckin,300);setTimeout(maybeCheckoutReminder,600)}});

/* home-screen icon (artifact editions only; the web version uses the real icon files) */
if(!window.TEND_WEB)try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,180);g.addColorStop(0,'#DCD0EE');g.addColorStop(1,'#F6CDB7');x.fillStyle=g;x.fillRect(0,0,180,180);
  x.fillStyle='#E3C2E0';x.beginPath();x.ellipse(90,112,52,48,0,0,Math.PI*2);x.fill();x.fillStyle='#FCEDEA';x.beginPath();x.ellipse(90,128,30,22,0,0,Math.PI*2);x.fill();
  x.fillStyle='#3B2541';[72,108].forEach(cx=>{x.beginPath();x.ellipse(cx,104,7,9,0,0,Math.PI*2);x.fill()});
  x.strokeStyle='#8FA88C';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(90,66);x.quadraticCurveTo(86,52,90,40);x.stroke();
  x.fillStyle='#B3C9AC';x.beginPath();x.ellipse(76,44,14,7,.5,0,Math.PI*2);x.fill();x.fillStyle='#94AE90';x.beginPath();x.ellipse(104,40,15,7.5,-.5,0,Math.PI*2);x.fill();
  const href=c.toDataURL('image/png');['apple-touch-icon','icon'].forEach(rel=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)});}catch(e){}


render();
try{webInit();webGo()}catch(e){}
if(S.onboarded)setTimeout(()=>{try{if(checkUnlocks().length)save()}catch(e){}},1500);
if(S.onboarded)setTimeout(maybeCheckoutReminder,900);
setTimeout(()=>{try{remCheck(true)}catch(e){}},2600);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')try{remCheck(true)}catch(e){}});
if(!S.onboarded)setTimeout(startOnboarding,300);else setTimeout(maybePromptCheckin,600);
initCloud();
})();
