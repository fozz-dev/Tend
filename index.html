<!DOCTYPE html>
<html lang="en" data-theme="sunset">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tend">
<meta name="theme-color" content="#E4DAF2" id="themeColor">
<title>Tend</title>
<style>
/* ================= themes ================= */
:root,[data-theme=sunset]{
  --html:#E4DAF2;--bg:linear-gradient(180deg,#E4DAF2 0%,#ECDCEC 30%,#F6DDD3 62%,#F6D2BE 100%);
  --plum:#3B2541;--plum2:#6A5272;--line:#EADCE4;
  --mauve:#976B93;--mauve-deep:#745372;--peach-ring:#9E6D57;--on-primary:#fff;--mauve-soft:#F0E3EF;
  --lav:#DCD0EE;--lav-soft:#EFE8F8;
  --peach:#F6CDB7;--peach-soft:#FCE8DC;--apricot:#F3BE9C;--peach-ink:#7A4A3A;--peach-on:#7A4A3A;
  --card:#FFF9F3;--tile0:#EFE8F8;--tile1:#FCE8DC;--tile2:#F0E3EF;--seg:rgba(255,249,243,.55);
  --sky:linear-gradient(180deg,#CDBFEA 0%,#E2C9E6 45%,#F6D3C6 80%,#F8D9C5 100%);
  --sky-night:linear-gradient(180deg,#A99AD0 0%,#C7B3DD 45%,#EBC7C8 85%,#F1CFC2 100%);
  --hill1:#CDB8E2;--hill2:#E6C4DB;--hill3:#F6D7C8;--cloud:#FFF7F2;
  --sun:radial-gradient(circle,#FFF0E0 0%,#FBD9C0 55%,rgba(251,217,192,0) 72%);
  --track:#EBDDEA;--track-on:#C9A5C6;--stop-on:#9C7298;--stop-off:#DCCBDD;
  --bored:linear-gradient(120deg,#E3D3F0,#F4D2C8);--wind:linear-gradient(120deg,#D9CDEC,#E8D4EA);
  --sheet:linear-gradient(180deg,#F3EAF7,#FBE9DF);--celeb:linear-gradient(180deg,#E4D6F2,#F8DACB);
  --tabbar:rgba(255,249,243,.94);--toast:#3B2541;--toast-ink:#fff;--toast-act:#F6CDB7;--sh-c:126,90,124;
}
[data-theme=sage]{
  --html:#DDE8D6;--bg:linear-gradient(180deg,#DDE8D6 0%,#E8EEDD 35%,#F3F0E0 70%,#F5EEDB 100%);
  --plum:#2C3A2E;--plum2:#55665A;--line:#DCE3D2;
  --mauve:#6C8966;--mauve-deep:#506A4B;--peach-ring:#927E49;--on-primary:#fff;--mauve-soft:#E3ECDC;
  --lav:#CFDEC6;--lav-soft:#E8F0E1;
  --peach:#EAD9A9;--peach-soft:#F5EDD3;--apricot:#D9C07E;--peach-ink:#5E4E22;--peach-on:#5E4E22;
  --card:#FFFCF3;--tile0:#E8F0E1;--tile1:#F5EDD3;--tile2:#E3ECDC;--seg:rgba(255,252,243,.6);
  --sky:linear-gradient(180deg,#C9DCC8 0%,#DDE8D2 45%,#EFEFD8 80%,#F5F0DC 100%);
  --sky-night:linear-gradient(180deg,#A9C2B0 0%,#C6D6C0 50%,#E6E6CF 100%);
  --hill1:#B5CBA9;--hill2:#CADBBE;--hill3:#E7E8CC;--cloud:#FDFCF4;
  --sun:radial-gradient(circle,#FFFBEA 0%,#F2E6BE 55%,rgba(242,230,190,0) 72%);
  --track:#E3EBDB;--track-on:#A9C29F;--stop-on:#6E8C66;--stop-off:#D3DECB;
  --bored:linear-gradient(120deg,#D9E7D1,#F1EBD0);--wind:linear-gradient(120deg,#D6E3D2,#E6EBD6);
  --sheet:linear-gradient(180deg,#EEF4E8,#F8F3E2);--celeb:linear-gradient(180deg,#DCE9D4,#F5EED6);
  --tabbar:rgba(255,252,243,.94);--toast:#2C3A2E;--toast-ink:#fff;--toast-act:#EAD9A9;--sh-c:85,112,79;
}
[data-theme=lilac]{
  --html:#E2DFF3;--bg:linear-gradient(180deg,#E2DFF3 0%,#E2E7F3 40%,#EEEDF6 75%,#F3F1F7 100%);
  --plum:#2B2944;--plum2:#5A5878;--line:#E0DFEE;
  --mauve:#7B78B2;--mauve-deep:#5F5C98;--peach-ring:#6D7EA3;--on-primary:#fff;--mauve-soft:#ECEAF8;
  --lav:#D3D7EE;--lav-soft:#E9EDF7;
  --peach:#D3DDF0;--peach-soft:#E5ECF8;--apricot:#B7C6E6;--peach-ink:#33456E;--peach-on:#33456E;
  --card:#FDFCFF;--tile0:#ECEAF8;--tile1:#E5ECF8;--tile2:#F1EEF7;--seg:rgba(253,252,255,.6);
  --sky:linear-gradient(180deg,#C7C8EA 0%,#D7DDF1 45%,#E8EAF5 80%,#F2F0F7 100%);
  --sky-night:linear-gradient(180deg,#A5A8D6 0%,#C0C6E6 50%,#DEDFF0 100%);
  --hill1:#C3C3E5;--hill2:#D0DAEC;--hill3:#E9E8F4;--cloud:#FFFFFF;
  --sun:radial-gradient(circle,#FFFFFF 0%,#E6E9F7 55%,rgba(230,233,247,0) 72%);
  --track:#E6E5F3;--track-on:#B4B5DD;--stop-on:#7673AC;--stop-off:#D6D6EA;
  --bored:linear-gradient(120deg,#DCD9F1,#D9E3F2);--wind:linear-gradient(120deg,#D6D4EE,#DCE3F1);
  --sheet:linear-gradient(180deg,#EEECF8,#EEF2F8);--celeb:linear-gradient(180deg,#DEDCF3,#E3EAF6);
  --tabbar:rgba(253,252,255,.94);--toast:#2B2944;--toast-ink:#fff;--toast-act:#D3DDF0;--sh-c:97,94,154;
}
[data-theme=desert]{
  --html:#F2E4D3;--bg:linear-gradient(180deg,#F2E4D3 0%,#F1DCD2 40%,#EFD6C7 75%,#EDD3C0 100%);
  --plum:#3F2A2A;--plum2:#6C5250;--line:#EBD9CC;
  --mauve:#A96661;--mauve-deep:#824E52;--peach-ring:#8D733F;--on-primary:#fff;--mauve-soft:#F4E1DC;
  --lav:#EAD3C6;--lav-soft:#F5E8DC;
  --peach:#EAD7A4;--peach-soft:#F6ECD0;--apricot:#D9BF7C;--peach-ink:#5E451A;--peach-on:#5E451A;
  --card:#FFF8EF;--tile0:#F5E8DC;--tile1:#F6ECD0;--tile2:#F4E1DC;--seg:rgba(255,248,239,.6);
  --sky:linear-gradient(180deg,#E9CFC3 0%,#F0D9C9 45%,#F4E3CC 80%,#F5E8D2 100%);
  --sky-night:linear-gradient(180deg,#C9A6A6 0%,#DDBDB4 50%,#EDD6C3 100%);
  --hill1:#D9B2A6;--hill2:#E6C8B5;--hill3:#F1DEC4;--cloud:#FFF8F0;
  --sun:radial-gradient(circle,#FFF6E4 0%,#F1DDB0 55%,rgba(241,221,176,0) 72%);
  --track:#F0E1D6;--track-on:#D6A9A2;--stop-on:#94595D;--stop-off:#E5CFC2;
  --bored:linear-gradient(120deg,#F1DCD3,#F3E5C9);--wind:linear-gradient(120deg,#E9D2CB,#EFDCCD);
  --sheet:linear-gradient(180deg,#F7EBE1,#F6E6D4);--celeb:linear-gradient(180deg,#F1DCD3,#F5E6CA);
  --tabbar:rgba(255,248,239,.94);--toast:#3F2A2A;--toast-ink:#fff;--toast-act:#EAD7A4;--sh-c:148,89,93;
}
[data-theme=night]{
  --html:#1C1730;--bg:linear-gradient(180deg,#1C1730 0%,#211D3B 40%,#1D2238 75%,#1A1F33 100%);
  --plum:#F4ECF8;--plum2:#C6BAD4;--line:#3A3354;
  --mauve:#B79BE0;--mauve-deep:#C6AAEE;--peach-ring:#EBC9AE;--on-primary:#1F1A33;--mauve-soft:#342C50;
  --lav:#4A4072;--lav-soft:#302A4C;
  --peach:#EBC9AE;--peach-soft:#3A3150;--apricot:#EBC9AE;--peach-ink:#F4D6BC;--peach-on:#2A2035;
  --card:#2A2442;--tile0:#D9CDF0;--tile1:#F0D6C8;--tile2:#E3CFE6;--seg:rgba(255,255,255,.06);
  --sky:linear-gradient(180deg,#151433 0%,#25204A 50%,#3B2C57 85%,#4A3561 100%);
  --sky-night:linear-gradient(180deg,#151433 0%,#25204A 50%,#3B2C57 85%,#4A3561 100%);
  --hill1:#2E2950;--hill2:#3A2F5E;--hill3:#4A3A68;--cloud:rgba(220,210,245,.22);
  --sun:radial-gradient(circle,#FFF8F0 0%,#E5DAF7 42%,rgba(229,218,247,0) 72%);
  --track:#3A3356;--track-on:#8F79BD;--stop-on:#C6AAEE;--stop-off:#4A4270;
  --bored:linear-gradient(120deg,#2F2850,#3A2C4E);--wind:linear-gradient(120deg,#2B2650,#352A52);
  --sheet:linear-gradient(180deg,#26203E,#221D36);--celeb:linear-gradient(180deg,#2C2550,#3A2C52);
  --tabbar:rgba(36,31,58,.95);--toast:#F4ECF8;--toast-ink:#1F1A33;--toast-act:#7E5A7C;--sh-c:0,0,0;
}
:root{--sh:0 4px 0 rgba(var(--sh-c),.10),0 8px 20px rgba(var(--sh-c),.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--html)}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--plum);font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;background:var(--bg) fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);transition:background .4s,color .4s}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:var(--mauve-deep);word-break:break-all;font-weight:800}
:focus-visible{outline:3px solid var(--mauve-deep);outline-offset:2px;box-shadow:0 0 0 5px var(--card)}
h1,h2,h3{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;margin:0}
h1{font-size:31px;line-height:1.1}
h2{font-size:20px}
#app{max-width:480px;margin:0 auto;padding:0 16px calc(118px + env(safe-area-inset-bottom))}
.sub{color:var(--plum2);font-weight:700;margin:4px 0 0}
.small{font-size:13px}
.center{text-align:center}
.mt{margin-top:16px}
.anim .slide{animation:slideIn .5s both cubic-bezier(.2,.9,.3,1.1);animation-delay:var(--d,0s)}
@keyframes slideIn{from{opacity:0;transform:translateY(18px)}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 10px}
.brand{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;font-size:26px;display:flex;align-items:center;gap:6px}
.brand .b1{stroke:var(--mauve-deep)}.brand .b2{fill:var(--track-on)}.brand .b3{fill:var(--mauve)}
.pts{display:flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:999px;padding:7px 14px 7px 8px;font:900 17px ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--peach-ink);box-shadow:0 3px 0 rgba(var(--sh-c),.12)}
.spark{width:28px;height:28px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font-size:14px;color:var(--peach-on)}
.pts.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.18)}100%{transform:scale(1)}}
.round{border:0;background:var(--card);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--plum2);box-shadow:0 3px 0 rgba(var(--sh-c),.08);flex:none}

/* cards + buttons */
.card{background:var(--card);border-radius:26px;padding:16px;margin-top:14px;box-shadow:var(--sh)}
.btn{border:0;border-radius:18px;padding:14px 18px;font:900 16px ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:14px}
.btn.mauve{background:var(--mauve-deep);color:var(--on-primary);box-shadow:inset 0 -4px 0 rgba(0,0,0,.16)}
.btn.peach{background:var(--peach);color:var(--peach-on);box-shadow:inset 0 0 0 2px var(--peach-ring),inset 0 -4px 0 rgba(0,0,0,.08)}
.btn.lav{background:var(--lav-soft);color:var(--plum);box-shadow:inset 0 -3px 0 rgba(var(--sh-c),.12)}
.btn.cream{background:var(--card);color:var(--plum);box-shadow:0 3px 0 rgba(var(--sh-c),.12)}
.btn.ghost{background:transparent;color:var(--plum2)}
.btn.armed{background:var(--plum);color:var(--card)}
.btn.block{width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.link{border:0;background:none;font-weight:900;color:var(--mauve-deep);font-size:15px;padding:8px 4px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 2px}
.empty{color:var(--plum2);font-weight:700;text-align:center;padding:24px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--lav-soft);border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.badge{background:var(--peach-soft);color:var(--peach-ink);font-weight:900;font-size:13px;padding:3px 9px;border-radius:99px;white-space:nowrap}
.mins{background:var(--lav-soft);color:var(--plum);font-weight:800;font-size:12px;padding:3px 8px;border-radius:99px;white-space:nowrap}
.tag{background:var(--mauve-soft);color:var(--mauve-deep);font-weight:900;font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap}
.lv{display:inline-flex;gap:1px;align-items:center}
.meta{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:13px;font-weight:700;color:var(--plum2);flex-wrap:wrap}
.note{font-size:14px;color:var(--plum2);font-weight:700;margin-top:6px}
.bar{height:9px;border-radius:9px;background:var(--lav-soft);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--lav),var(--track-on));transition:width .5s}
.bar.pe{background:var(--peach-soft)}.bar.pe i{background:linear-gradient(90deg,var(--peach),var(--apricot))}

/* scene */
.scene{position:relative;height:250px;border-radius:30px;overflow:hidden;background:var(--sky);box-shadow:0 10px 30px rgba(var(--sh-c),.18)}
.scene.night{background:var(--sky-night)}
.sun{position:absolute;right:38px;top:34px;width:70px;height:70px;border-radius:50%;background:var(--sun);animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08)}}
.stars{display:none;position:absolute;inset:0}
.scene.night .stars,[data-theme=night] .stars{display:block}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFF6EA;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.cloud{position:absolute;left:-120px}
.cloud path{fill:var(--cloud)}
.c1{top:26px;animation:drift 38s linear infinite}
.c2{top:70px;animation:drift 52s linear infinite;animation-delay:-20s;opacity:.8}
.c3{top:14px;animation:drift 64s linear infinite;animation-delay:-44s;opacity:.7}
@keyframes drift{to{transform:translateX(640px)}}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:110px}
.hl1{fill:var(--hill1)}.hl2{fill:var(--hill2)}.hl3{fill:var(--hill3)}
.critter{position:absolute;left:50%;bottom:12px;width:140px;margin-left:-58px;transform-origin:50% 100%;cursor:pointer}
.critter.hop{animation:hop .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{30%{transform:translateY(-34px) scale(1.04,.96)}60%{transform:translateY(0) scale(1.06,.92)}100%{transform:none}}
.ia{transform-box:fill-box;transform-origin:50% 100%}
.idle-pip .ia{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) scaleY(1.02)}}
.idle-cactus .ia{animation:wiggle 2.8s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.idle-mushroom .ia{animation:squish 2.2s ease-in-out infinite}
@keyframes squish{50%{transform:scale(1.05,.94)}}
.idle-succulent .ia{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.045)}}
.idle-monstera .ia{animation:sway2 4.2s ease-in-out infinite}
@keyframes sway2{25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}
.idle-tulip .ia{animation:tulip 3.4s ease-in-out infinite}
@keyframes tulip{30%{transform:rotate(-2deg) translateY(-2px)}70%{transform:rotate(2deg)}}
.eyes{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.wave{transform-origin:22% 80%;transform-box:fill-box;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-24deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-18deg)}}
.sway{transform-origin:50% 100%;transform-box:fill-box;animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(4deg)}}
.glow{animation:tw 2.4s ease-in-out infinite}
.bubble{position:absolute;left:16px;top:16px;max-width:60%;background:var(--card);border-radius:20px 20px 20px 6px;padding:11px 14px;box-shadow:0 4px 0 rgba(var(--sh-c),.12)}
.anim .bubble{animation:pop .6s .3s both cubic-bezier(.3,1.5,.5,1)}
.bubble b{display:block;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:19px}
.bubble span{font-size:14px;color:var(--plum2);font-weight:800}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(8px)}}
.ntag{position:absolute;left:14px;bottom:14px;border:0;background:var(--card);border-radius:16px;padding:7px 12px;text-align:left;box-shadow:0 3px 0 rgba(var(--sh-c),.14)}
.ntag b{display:block;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:17px;line-height:1.1}
.ntag span{font-size:12px;font-weight:800;color:var(--plum2)}

/* journey */
.j-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.j-head span{font-weight:800;color:var(--plum2);font-size:14px}
.journey{position:relative;margin-top:18px}
#jsvg{display:block;width:100%;height:auto;overflow:visible}
.jt{stroke:var(--track)}.jd{stroke:var(--track-on)}
.stop{fill:var(--card);stroke:var(--stop-off)}.stop.on{fill:var(--stop-on);stroke:var(--stop-on)}
.jav{position:absolute;width:42px;height:48px;margin:-42px 0 0 -21px;left:0;top:0;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(var(--sh-c),.18))}
.jav svg{width:100%;height:100%}
.j-msg{font-size:14px;font-weight:800;color:var(--plum2);margin-top:2px}

/* check-in row */
.ci{display:flex;gap:6px;align-items:center;padding:12px;overflow:hidden}
.ci-cta{display:flex;gap:14px;align-items:center;width:100%;border:0;text-align:left;color:var(--plum);background:linear-gradient(120deg,var(--card),var(--peach-soft))}
.ci-cta b{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:20px;display:block}
.edit{margin-left:auto;border:2px solid var(--line);background:transparent;border-radius:999px;width:38px;height:38px;display:grid;place-items:center;color:var(--mauve-deep);flex:none}
.gentle{margin-top:12px;padding:10px 12px;border-radius:16px;background:var(--lav-soft);font-weight:800;font-size:14px}

/* tasks */
.task{background:var(--card);border-radius:24px;margin-top:10px;box-shadow:var(--sh);transition:transform .35s,opacity .35s;overflow:hidden}
.task.first{box-shadow:0 0 0 3px var(--lav),var(--sh)}
.task.leaving{transform:translateX(110%) rotate(4deg);opacity:0}
.task.is-done{opacity:.72}
.t-row{display:flex;align-items:center;gap:12px;padding:12px}
.tile{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;flex:none}
.tl0{background:var(--tile0)}.tl1{background:var(--tile1)}.tl2{background:var(--tile2)}
.tbody{flex:1;min-width:0;cursor:pointer}
.tbody b{display:block;font-size:17px;font-weight:900;line-height:1.2}
.is-done .tbody b{text-decoration:line-through;color:var(--plum2)}
.tick{width:56px;height:56px;border-radius:20px;border:0;background:var(--lav-soft);display:grid;place-items:center;flex:none;box-shadow:inset 0 -4px 0 rgba(var(--sh-c),.14);color:var(--mauve);padding:0}
.tick svg{opacity:1}
.tick:active{transform:scale(.92)}
.tick.done{background:var(--mauve-deep);color:var(--on-primary);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.tick.done svg{opacity:1}
.tick.pop{animation:tickBounce .55s cubic-bezier(.3,1.8,.5,1)}
@keyframes tickBounce{0%{transform:scale(.8)}45%{transform:scale(1.22)}100%{transform:scale(1)}}

/* bored + wind */

/* hobbies */

/* rewards */

/* forms */
input[type=text],input[type=number],textarea,select{width:100%;border:0;background:var(--card);border-radius:18px;padding:14px 16px;font:800 16px ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--plum);outline:none;box-shadow:inset 0 0 0 2px var(--line);-webkit-appearance:none;appearance:none}

textarea{resize:vertical}
.lbl{display:block;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--plum2);margin:20px 0 10px}

.toggle{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:900}
.toggle input{width:24px;height:24px;accent-color:var(--mauve-deep)}input[type=checkbox],input[type=radio]{min-width:22px;min-height:22px;accent-color:var(--mauve-deep)}

.setrow span.v{color:var(--plum2);font-weight:800}
.faces{display:flex;justify-content:space-between;gap:2px}

.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.en{border:0;background:var(--card);color:var(--plum);border-radius:20px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 rgba(var(--sh-c),.12)}

.stage{display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;margin-top:6px}

.charc.on{box-shadow:0 0 0 3px var(--mauve-deep)}

.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.thc{border:0;border-radius:20px;padding:8px 8px 10px;background:var(--card);color:var(--plum);text-align:left;box-shadow:0 3px 0 rgba(var(--sh-c),.14);display:flex;flex-direction:column;gap:1px}

.th-prev{display:block;height:66px;border-radius:14px;background:var(--bg);position:relative;overflow:hidden;margin-bottom:6px}

.th-dot{width:30px;height:30px;border-radius:50%;background:var(--sky);box-shadow:inset 0 0 0 3px var(--card),0 0 0 2px var(--mauve);flex:none}

/* nav */
.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;background:var(--tabbar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:26px;display:flex;padding:7px;box-shadow:0 8px 28px rgba(var(--sh-c),.2);z-index:10}
.tab{flex:1;border:0;background:none;border-radius:18px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:11.5px;color:var(--plum2);min-width:0}
.tab.on{background:var(--lav-soft);color:var(--plum);box-shadow:inset 0 -3px 0 var(--mauve-deep)}.tab.on span{font-weight:900}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(30,20,40,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}

#sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--sheet);color:var(--plum);border-radius:30px 30px 0 0;padding:12px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1.05);z-index:21;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;visibility:hidden;box-shadow:0 -10px 40px rgba(var(--sh-c),.2)}
#sheet.on{transform:none;visibility:visible}
#sheet.short{max-height:66vh}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}

/* celebration */
#celeb{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(30,20,40,.4);opacity:0;pointer-events:none;transition:opacity .3s}
#celeb.on{opacity:1;pointer-events:auto}
.cb{position:relative;width:100%;max-width:360px;border-radius:34px;padding:26px 22px 22px;text-align:center;background:var(--celeb);color:var(--plum);box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden;transform:scale(.8);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
#celeb.on .cb{transform:none}
.rays{position:absolute;left:50%;top:150px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,249,243,.5) 0 10deg,transparent 10deg 24deg);border-radius:50%;animation:spin 18s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
.cb>*:not(.rays){position:relative}
.cb .cpip{width:150px;margin:6px auto 4px;display:block;animation:hop 1.2s .3s cubic-bezier(.3,1.5,.5,1)}
.cb h1{font-size:27px;margin-top:4px}
.cb p{font-weight:800;color:var(--plum2);margin:8px 0 16px}

/* brain dump flow */
.flow{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(102%);transition:transform .4s cubic-bezier(.2,.9,.3,1.05);visibility:hidden}
.flow.on{transform:none;visibility:visible}
.flow-in{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.fl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dots{display:flex;gap:6px}.dots i{width:28px;height:6px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--mauve-deep)}
.dumpbox{background:var(--card);border-radius:26px;padding:12px;margin-top:14px;box-shadow:var(--sh)}

.dump-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:2px dashed var(--line);padding:10px 4px 2px;flex-wrap:wrap}

.mic{border:0;background:var(--mauve-deep);color:var(--on-primary);border-radius:999px;padding:10px 16px;display:flex;gap:8px;align-items:center;font-weight:900;font-size:15px}

@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(var(--sh-c),.14)}}
.note-err{background:var(--lav-soft);font-weight:800}
.feel{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:21px;margin:10px 0 0;color:var(--mauve-deep)}
.rt{padding:12px}
.rt-h{display:flex;gap:8px;align-items:center}
.rt-h input{font-weight:900;font-size:17px;padding:11px 12px}
.rt-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}
.rt-l{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--plum2);width:54px}
.mchip{border:0;background:var(--lav-soft);color:var(--plum);border-radius:12px;padding:7px 11px;font-weight:900;font-size:13px}
.mchip.on{background:var(--mauve-deep);color:var(--on-primary)}
.rs{display:flex;gap:6px;align-items:center;margin-top:8px}
.rs input{flex:1;min-width:0;padding:10px 12px;font-size:15px}
.rs select{width:72px;flex:none;padding:10px 6px;font-size:15px}
.fl-foot{margin-top:18px}
.cal-row{display:flex;gap:8px;align-items:center}
.gdot{width:11px;height:11px;border-radius:50%;background:var(--line);flex:none}.gdot.ok{background:#8FB18B}
.tl{position:relative;margin-top:16px}
.tl-hr{position:absolute;left:0;right:0;border-top:1.5px dashed var(--line)}
.tl-hr span{position:absolute;left:0;top:-9px;font-size:11px;font-weight:900;color:var(--plum2)}
.tl-now{position:absolute;left:44px;right:0;border-top:2.5px solid var(--mauve);z-index:3}

.tl-i.chunk{border-left:5px solid var(--mauve)}

.tl-act{display:flex;gap:4px;flex:none}

.unl{font-weight:800;font-size:14px;padding:6px 0;border-top:2px dashed var(--line)}
.dump-cta{display:flex;align-items:center;gap:14px;width:100%;border:0;text-align:left;color:var(--plum);background:linear-gradient(120deg,var(--card),var(--lav-soft))}
.dump-cta b{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:20px;display:block}

function faceSVG(cx,ey,sp,es,kind){

/* Spreads project steps over the coming days: sessions of 30–60 min (30 on low-energy days), at most 2 project sessions a day,

    const sess=Math.max(1,Math.ceil(q.reduce((a,s)=>a+s.minutes,0)/50)),span=Math.max(1,Math.floor(((parseDK(due)-parseDK(startDay))/DAY+1)*0.8));
    return{p,q,due,n:0,gap:Math.max(1,Math.floor(span/sess)),next:addDays(startDay,ix%2)}});
  const last=Q.reduce((a,x)=>x.due>a?x.due:a,startDay);let rr=0;

      const w=windowOf(k);let from=w.from;const work=routinesOn(k).filter(r=>r.e-r.s>=240);if(work.length)from=Math.max(from,Math.max(...work.map(r=>r.e)));

  return Q;
}

function scheduleTaskProject(t){

  const apply=()=>{const snap=JSON.stringify(S);blocks.forEach(b=>{let m=b.s;b.steps.forEach(id=>{const s=t.steps.find(x=>x.id===id);if(s){s.at=atDK(b.date,m).getTime();m+=s.minutes}});S.blocks.push({id:uid(),date:b.date,s:b.s,e:b.e,title:b.title,kind:'task',energy:b.energy,out:false,cal:false,gid:null,project:true,taskId:t.id,stepIds:b.steps.slice()})});

  if(!blocks.length){save();closeSheet();render();toast('No free time found before the due date. The steps are saved in your to-dos.');return}
  if(S.settings.projAuto==='auto'){apply();return}
  openSheet(`<h1 style="font-size:26px">${esc(t.title)}</h1><p class="sub">Here’s how I’d spread it, at most ${PROJ_MAX_DAY} project sessions a day, around your routines and plans.</p>
    ${blocks.map(b=>`<div class="rpl"><span class="rpw"><b>${esc(dateLabel(b.date))}</b><span>${fmt(b.s)}–${fmt(b.e)}</span></span><span class="rpt"><b>${esc(b.title)}</b><span>${b.steps.map(id=>esc((t.steps.find(s=>s.id===id)||{}).title||'')).join(' · ')}</span></span></div>`).join('')}
    ${left?`<p class="sub small">${left} step${left===1?'':'s'} didn’t fit before ${esc(dateLabel(t.due))}.</p>`:''}<button class="btn ghost block" data-close>Not now (keep the steps)</button>
    <div class="stickybar"><button class="btn peach block" data-ok style="padding:16px;font-size:17px">✓ Add ${blocks.length} session${blocks.length===1?'':'s'} to my plan</button></div>`,el=>{
    el.onclick=e=>{const b=btnOf(e);if(!b)return;if(b.hasAttribute('data-ok'))apply();else{save();closeSheet();render()}}});
}

/* ================= One way to reschedule (used by every path) =================

function detachSteps(t,ids,out){
  (S.blocks||[]).forEach(ob=>{if(ob.taskId===t.id&&ob.stepIds&&ob.stepIds.some(id=>ids.has(id))){ob.stepIds=ob.stepIds.filter(id=>!ids.has(id));out.touched.add(ob)}});
  if(!t.steps.length)(S.blocks||[]).forEach(ob=>{if(ob.taskId===t.id&&atDK(ob.date,ob.e).getTime()>Date.now()-864e5){ob.stepIds=[];out.touched.add(ob)}});

function finishDetach(out){

}
async function syncGoogle(out){
  if(!MCP||(!out.gdel.length&&!out.gnew.length))return;
  for(const ob of out.gdel){try{await gDelete(ob.gid)}catch(e){out.gfail++}}
  for(const b of out.gnew){try{b.gid=await gCreate(b);b.cal=!!b.gid}catch(e){out.gfail++;b.cal=false}}
  Object.keys(CAL).forEach(k=>delete CAL[k]);save();
}

const REP_OPTS=[['never','Never'],['daily','Every day'],['weekdays','Weekdays (Mon–Fri)'],['weekends','Weekends'],['weekly','Every week on…'],['w2','Every 2 weeks'],['w3','Every 3 weeks'],['w4','Every 4 weeks'],['monthly','Every month'],['custom','Custom']];

function rBase(r,k){const d=parseDK(k),dow=d.getDay(),{f,n,days,mmode}=repNorm(r),a=parseDK(r.anchor);

    case 'weekly':return days.includes(dow)&&(n<=1||((wkIdx(k)-wkIdx(r.anchor))%n+n)%n===0);
    case 'monthly':{const md=(d.getFullYear()-a.getFullYear())*12+d.getMonth()-a.getMonth();if(md%n)return false;
      if(mmode==='nth'){if(dow!==a.getDay())return false;const an=nthOf(a);return an>=5?d.getDate()+7>daysIn(d):nthOf(d)===an}
      return d.getDate()===Math.min(a.getDate(),daysIn(d))}}
  return false}

  if(!rBase(r,k))return false;if(r.count&&occIndex(r,k)>r.count)return false;return true}

function microFor(title){const m=MICRO.find(([re])=>re.test(title));return m?m[1].map(([t,mi])=>({title:t,minutes:mi})):null}
const joinTitles=ts=>ts.length<=2?ts.join(' + '):`${ts.slice(0,-1).join(', ')} and ${ts[ts.length-1]}`;
/* Atoms = the medium-sized original steps behind any merged or split steps. */
function atomsOf(steps){const out=[];
  steps.forEach(s=>{
    if(s.parts&&s.parts.length){atomsOf(s.parts).forEach(p=>out.push({...p,src:(p.src||[]).concat(s.src||[s.id]).filter(Boolean)}));return}
    if(s.grp){const last=out[out.length-1];if(last&&last.grpId===s.grp.id){last.src.push(s.id);return}
      out.push({title:s.grp.title,minutes:s.grp.minutes,phase:s.phase,energy:s.energy,grpId:s.grp.id,src:[s.id]});return}
    out.push({title:s.title,minutes:s.minutes||10,phase:s.phase,energy:s.energy,src:[s.id]})});
  return out.map(a=>({title:a.title,minutes:a.minutes,phase:a.phase,energy:a.energy,src:[...new Set(a.src)]}))}
const stepOf=(a,extra)=>Object.assign({id:uid(),title:a.title,minutes:a.minutes,done:false,at:null,phase:a.phase,energy:a.energy,src:a.src},extra||{});
function splitTiny(a,fixed){
  if((a.minutes||10)<=5)return[stepOf(a)];
  const kb=microFor(a.title);const g={id:uid(),title:a.title,minutes:a.minutes};
  if(kb)return kb.map(x=>stepOf({...a,title:x.title,minutes:x.minutes},{grp:g}));
  if(fixed)return[stepOf(a)];
  const n=Math.max(2,Math.min(8,Math.ceil(a.minutes/5))),per=Math.max(2,Math.round(a.minutes/n)),t=a.title.replace(/\.$/,'');
  const lc=t.charAt(0).toLowerCase()+t.slice(1);
  const ts=n===2?[`Start: ${lc}`,`Finish: ${lc}`]:[`Get set up for: ${lc}`].concat(Array.from({length:n-2},(_,i)=>i===0?`Start: ${lc}`:`Keep going (${i+1})`)).concat([`Finish off and tidy up`]);
  return ts.map(x=>stepOf({...a,title:x,minutes:per},{grp:g}))}
function mergeRun(run){if(run.length===1)return stepOf(run[0]);
  return stepOf({title:joinTitles(run.map(a=>a.title)),minutes:run.reduce((x,a)=>x+a.minutes,0),phase:run[0].phase,energy:run.some(a=>a.energy==='high')?'high':run[0].energy,src:run.flatMap(a=>a.src)},{parts:run.map(a=>({title:a.title,minutes:a.minutes,phase:a.phase,energy:a.energy}))})}
/* steps → steps at level lv. title = the task's name. opts.fixed: the person gave a length, so don't invent generic mini steps. */
function levelSteps(steps,lv,title,opts){opts=opts||{};if(!steps||!steps.length)return steps;
  const atoms=atomsOf(steps),tot=atoms.reduce((a,x)=>a+(x.minutes||10),0);
  if(lv==='tiny')return atoms.flatMap(a=>splitTiny(a,opts.fixed));
  if(lv==='overview'){
    const phases=[...new Set(atoms.map(a=>a.phase).filter(Boolean))];
    if(phases.length>1)return phases.map(p=>{const run=atoms.filter(a=>a.phase===p),s=mergeRun(run);if(run.length>1)s.title=p;return s});
    if(atoms.length<=1||tot<=45){const s=mergeRun(atoms);if(atoms.length>1)s.title=title||s.title;return[s]}
    const k=Math.max(2,Math.min(4,Math.round(tot/30))),per=tot/k,out=[];let run=[],sum=0;
    atoms.forEach((a,i)=>{run.push(a);sum+=a.minutes;const left=atoms.length-i-1;if((sum>=per&&out.length<k-1)||left===0){out.push(mergeRun(run));run=[];sum=0}});
    return out}
  /* medium: join tiny neighbours up to ~20 min */
  const out=[];let run=[],sum=0;
  const flush=()=>{if(run.length)out.push(mergeRun(run));run=[];sum=0};
  atoms.forEach(a=>{const m=a.minutes||10;if(run.length&&(m>=10||sum+m>20||run[0].phase!==a.phase||run.length>=4))flush();if(m>=10){out.push(stepOf(a));return}run.push(a);sum+=m});flush();
  return out}
/* Re-levels one task's unfinished steps and keeps its Calendar blocks in step. */
function relevelTask(t,lv){

  const home=new Map();blocks.forEach(b=>(b.stepIds||[]).forEach(id=>home.set(id,b)));
  blocks.forEach(b=>{b.stepIds=b.stepIds.filter(id=>!und.some(s=>s.id===id))});
  ns.forEach(s=>{const b=(s.src||[]).map(id=>home.get(id)).find(Boolean);if(b)b.stepIds.push(s.id)});
  t.steps=t.steps.filter(s=>s.done).concat(ns);t.lv=lv;

/* Plays a reveal in el (the stage). Calls done() once, after the animation or when skipped. */
function playReveal(el,pick,names,done){
  const k=pickReveal(),name=pick.name,T=[],at=(ms,f)=>T.push(setTimeout(f,ms));let fin=false;
  const pool=[...new Set(names.filter(n=>n!==name))].sort(()=>Math.random()-.5);
  const finish=()=>{if(fin)return;fin=true;T.forEach(clearTimeout);el.onclick=null;el.classList.add('rvend');buzz(25);blip(880,.18);done(k)};
  el.className='rv rv-'+k;el.dataset.k=k;
  const skip=()=>{if(fin)return;el.innerHTML=`<div class="rvfinal">${paperHTML(name,'open')}</div>`;finish()};
  if(k==='fade'){el.innerHTML=`<div class="rvfinal rvfade">${paperHTML(name,'open')}</div>`;at(450,finish);return{skip,k}}
  if(k==='dial'){const n=Math.min(8,Math.max(4,pool.length+1)),list=pool.slice(0,n-1);const j=Math.floor(Math.random()*n);list.splice(j,0,name);

    el.innerHTML=`<div class="rvdialw">${dialSVG(list,j)}</div>`;const w=el.querySelector('.rvwheel'),a=360/list.length,end=360*5-(j*a+a/2)+(Math.random()-.5)*a*.5;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{w.style.transform=`rotate(${end}deg)`}));
    [80,180,300,450,640,880,1160,1480,1850].forEach((t,i)=>at(t,()=>{buzz(6);blip(500+i*30,.05)}));
    at(2200,()=>{el.querySelector('.rvdialw').insertAdjacentHTML('beforeend',paperHTML(name,'open pop'));finish()});return{skip,k}}
  if(k==='hatthrow'){const fl=Array.from({length:6},(_,i)=>{const x=(i-2.5)*48+(Math.random()-.5)*20,y=-60-Math.random()*90,r=(Math.random()-.5)*160;return `<i class="rvflyer" style="--x:${x}px;--y:${y}px;--r:${r}deg;animation-delay:${.35+i*.06}s"></i>`}).join('');
    el.innerHTML=`<div class="rvthrow"><div class="rvhat tip">${hatSVG()}</div>${fl}${paperHTML(name,'lands')}</div>`;at(420,()=>{buzz(12);blip(420)});at(1300,()=>{buzz(10);blip(700)});at(2000,finish);return{skip,k}}

    const jb=el.querySelector('.rvjarb');let shaken=false;const go=()=>{if(shaken)return;shaken=true;el.classList.add('go');buzz([10,40,10,40,10]);blip(300,.2);at(900,()=>{buzz(12);blip(760)});at(1700,finish)};
    jb.addEventListener('click',e=>{e.stopPropagation();go()});at(450,go);return{skip,k}}
  if(k==='dice'){el.innerHTML=`<div class="rvdice"><div class="rvcup">${cupSVG()}</div><div class="rvdie"><i class="pp a"></i><i class="pp b"></i><i class="pp c"></i><i class="pp d"></i><span>${esc(name)}</span></div></div>`;
    [100,250,400,550,700].forEach(t=>at(t,()=>{buzz(6);blip(260,.04)}));at(950,()=>{buzz(15);blip(500)});at(2000,finish);return{skip,k}}
  return{skip,k}}

/* ===== Points difficulty ===== */
const DIFF={easy:[1,'Easy','Easy: the original amounts.'],balanced:[.5,'Balanced','Balanced: about half the original points.'],challenging:[.25,'Challenging','Challenging: about a quarter of the original points.']};
const diffKey=()=>DIFF[S.settings.diff]?S.settings.diff:'balanced';
const dFactor=()=>DIFF[diffKey()][0];
const DAY_CAP=150; /* original-scale points per day before the bonus round (half points) */
function earnedToday(){const k=dkey();return S.ledger.reduce((a,l)=>a+(l.points>0&&l.reason!=='Earlier points'&&dkey(new Date(l.at))===k?l.points:0),0)}
function growXP(){if(S.grow.xp==null)S.grow.xp=S.grow.lifetime||0;return S.grow.xp}
/* Effort: tiny steps earn less, long or high-energy ones more. Base = the "Each step" setting (a 5–15 min step). */
function stepBaseOld(s,t){const m=(s&&s.minutes)||10,b=+S.settings.pts.step||0;let x=m<5?b*.6:m<15?b:m<30?b*1.4:b*2;if(((s&&s.energy)||(t&&t.energy))==='high')x*=1.25;return x}
/* Fair value: every to-do has one fixed value from its estimated time and energy. Its steps share that value,
   so Tiny, Medium or Overview steps all add up to the same total. */
const STOPV=()=>Math.max(1,(+S.settings.pts.step||5)*Math.pow(1.5,.85)); /* one journey stop = about 15 minutes of real effort */
function taskEst(t){if(t.estMin==null){const all=t.steps.reduce((a,x)=>a+(x.minutes||10),0)||15;t.estMin=all;
    if(t.vDone==null){const dm=t.steps.filter(x=>x.done).reduce((a,x)=>a+(x.minutes||10),0);t.vDone=taskValue(t)*dm/all}}return t.estMin}
function taskValue(t){const b=+S.settings.pts.step||0,M=t.estMin!=null?t.estMin:taskEst(t);let v=b*Math.max(.6,Math.pow(M/10,.85));if(t.energy==='high')v*=1.25;return v}
function stepShare(s,t){taskEst(t);if(s.done)return 0;const und=t.steps.filter(x=>!x.done),m=und.reduce((a,x)=>a+(x.minutes||10),0)||1,left=Math.max(0,taskValue(t)-(t.vDone||0));return left*((s.minutes||10)/m)}
function stepBase(s,t){return t&&t.steps&&s&&t.steps.includes(s)?stepShare(s,t):stepBaseOld(s,t)}
const capF=()=>earnedToday()>=DAY_CAP*dFactor()?.5:1;
/* ✦ for a step, rounded across the whole task so tiny steps add up exactly (some tiny steps give less than 1 ✦) */
function stepPts(s,t){const b=stepBase(s,t);if(!t||!t.steps||!t.steps.includes(s))return preview(b);const raw=b*mult()*dFactor()*capF(),pf=t.pf||0;return Math.max(0,Math.round(pf+raw)-Math.round(pf))}
const ptsBadge=p=>p>0?`+${p} ✦`:'✦';
function ptsTableHTML(){const p=S.settings.pts,r=(b,f)=>b<=0?0:Math.max(1,Math.round(b*f));
  const rows=[['Tiny step (under 5 min)',stepBase({minutes:3})],['Step (5–15 min)',stepBase({minutes:10})],['Step (15–30 min)',stepBase({minutes:20})],['Long step (30+ min)',stepBase({minutes:40})],['High-energy step (10 min)',stepBase({minutes:10,energy:'high'})],
    ['Finishing a task (bonus)',+p.taskBonus],['Hobby or spin done',+p.hobby],['Brain dump',10],['Evening check-out',10],['Craving game finished',15],['Chose something else (craving)',15]];
  return `<div class="ptst"><table><thead><tr><th></th>${Object.values(DIFF).map(v=>`<th>${v[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(([l,b])=>`<tr><td>${l}</td>${Object.entries(DIFF).map(([k,v])=>`<td class="${k===diffKey()?'on':''}">${r(b,v[0])}</td>`).join('')}</tr>`).join('')}
  <tr><td>Bonus round starts after</td>${Object.entries(DIFF).map(([k,v])=>`<td class="${k===diffKey()?'on':''}">${Math.round(DAY_CAP*v[0])}/day</td>`).join('')}</tr>
  <tr><td>Fully grown (your goal) at</td>${Object.entries(DIFF).map(([k,v])=>`<td class="${k===diffKey()?'on':''}">${Math.round(goalXP()*v[0])}</td>`).join('')}</tr></tbody></table>
  <p class="sub small" style="margin:8px 2px 0">On a low-energy day everything is ×${S.settings.lowMult} (not the check-out, brain dump or games). After the daily amount, extra points are halved: “Bonus round”.</p></div>`}

/* ================= Sudoku (craving game + wind-down) ================= */
const SDK_BOX={4:[2,2],6:[2,3],9:[3,3]};
const SDK_HOLES={4:{quick:9},6:{quick:20},9:{easy:40,medium:48,hard:55}};
function sdkSolution(n){const[br,bc]=SDK_BOX[n];
  const base=(r,c)=>(bc*(r%br)+Math.floor(r/br)+c)%n;
  const bands=shuffle([...Array(n/br).keys()]),rows=bands.flatMap(b=>shuffle([...Array(br).keys()]).map(r=>b*br+r));
  const stacks=shuffle([...Array(n/bc).keys()]),cols=stacks.flatMap(s=>shuffle([...Array(bc).keys()]).map(c=>s*bc+c));
  const dig=shuffle([...Array(n).keys()].map(x=>x+1));
  return rows.flatMap(r=>cols.map(c=>dig[base(r,c)]))}
function sdkCount(g,n,lim){const[br,bc]=SDK_BOX[n];let cnt=0;const a=g.slice();
  const ok=(i,v)=>{const r=Math.floor(i/n),c=i%n;for(let k=0;k<n;k++){if(a[r*n+k]===v||a[k*n+c]===v)return false}
    const r0=r-r%br,c0=c-c%bc;for(let y=0;y<br;y++)for(let x=0;x<bc;x++)if(a[(r0+y)*n+c0+x]===v)return false;return true};
  const go=()=>{let best=-1,bc2=null;for(let i=0;i<a.length;i++)if(!a[i]){const cand=[];for(let v=1;v<=n;v++)if(ok(i,v))cand.push(v);if(!cand.length)return;if(!bc2||cand.length<bc2.length){best=i;bc2=cand;if(cand.length===1)break}}
    if(best<0){cnt++;return}for(const v of bc2){a[best]=v;go();a[best]=0;if(cnt>=lim)return}};
  go();return cnt}
function sdkMake(n,diff){const sol=sdkSolution(n),g=sol.slice(),want=(SDK_HOLES[n]||{})[diff]||SDK_HOLES[n].quick||Math.floor(n*n/2);let holes=0;
  for(const i of shuffle([...Array(n*n).keys()])){if(holes>=want)break;const v=g[i];g[i]=0;if(sdkCount(g,n,2)!==1)g[i]=v;else holes++}
  return{n,diff,sol,given:g.map(v=>v>0),grid:g.slice(),notes:Array.from({length:n*n},()=>[]),hist:[],sel:null,noteMode:false,hints:0,startedAt:Date.now()}}
const sdkLabel=p=>p.n===9?`9×9 · ${p.diff[0].toUpperCase()+p.diff.slice(1)}`:`Quick ${p.n}×${p.n}`;
/* Renders Sudoku into box. opts: {quick:true} offers the quick sizes first; onSolved(p) when finished. */
function sudokuUI(box,opts){opts=opts||{};
  const chooser=()=>{const sv=S.sudoku&&!S.sudoku.solved?S.sudoku:null;
    box.innerHTML=`${sv?`<button class="btn peach block" data-sdk="resume" style="padding:15px">▶ Continue your puzzle (${esc(sdkLabel(sv))})</button>`:''}
      <div class="lbl">${opts.quick?'Quick, about 2–5 minutes':'Quick'}</div><div class="row2"><button class="btn ${opts.quick&&!sv?'peach':'cream'}" data-sdk="q6">6×6</button><button class="btn cream" data-sdk="q4">4×4 (tiny)</button></div>
      <div class="lbl">${opts.quick?'Want something longer?':'Full 9×9'}</div><div class="sdkdiff">${['easy','medium','hard'].map(d=>`<button class="btn cream" data-sdk="f-${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('')}</div>`;
    box.onclick=e=>{const b=e.target.closest('[data-sdk]');if(!b)return;const k=b.dataset.sdk;
      if(k==='resume'){play(S.sudoku);return}
      b.textContent='Making a puzzle…';setTimeout(()=>{const p=k==='q6'?sdkMake(6,'quick'):k==='q4'?sdkMake(4,'quick'):sdkMake(9,k.slice(2));S.sudoku=p;save();play(p)},30)}};
  const conflicts=(p,i)=>{const v=p.grid[i];if(!v||p.given[i])return false;return v!==p.sol[i]};
  const play=p=>{const n=p.n,[br,bc]=SDK_BOX[n];
    const draw=()=>{const sel=p.sel,sv=sel!=null?p.grid[sel]:0,sr=sel!=null?Math.floor(sel/n):-1,sc=sel!=null?sel%n:-1,sb=sel!=null?Math.floor(sr/br)*br*100+Math.floor(sc/bc):-1;
      const left=p.grid.filter((v,i)=>v!==p.sol[i]).length;
      box.innerHTML=`<div class="sdkbar"><b>${esc(sdkLabel(p))}</b><span class="sub small">${left?`${left} to go`:'Solved!'}</span></div>
      <div class="sdk n${n}" style="--n:${n}">${p.grid.map((v,i)=>{const r=Math.floor(i/n),c=i%n,cls=['sc'];if(p.given[i])cls.push('g');if(i===sel)cls.push('sel');else if(r===sr||c===sc||(Math.floor(r/br)*br*100+Math.floor(c/bc))===sb)cls.push('rel');if(sv&&v===sv)cls.push('same');if(conflicts(p,i))cls.push('oops');
        if(c%bc===bc-1&&c<n-1)cls.push('br');if(r%br===br-1&&r<n-1)cls.push('bb');
        return `<button class="${cls.join(' ')}" data-c="${i}" aria-label="Row ${r+1} column ${c+1}${v?': '+v:''}">${v?v:p.notes[i].length?`<span class="nt" style="--bc:${bc}">${Array.from({length:n},(_,k)=>`<i>${p.notes[i].includes(k+1)?k+1:''}</i>`).join('')}</span>`:''}</button>`}).join('')}</div>
      <div class="sdkpad" style="--n:${n}">${Array.from({length:n},(_,k)=>`<button class="pd" data-v="${k+1}">${k+1}</button>`).join('')}</div>
      <div class="sdktools"><button class="chip ${p.noteMode?'on':''}" data-t="notes">✏️ Notes ${p.noteMode?'on':'off'}</button><button class="chip" data-t="undo" ${p.hist.length?'':'disabled'}>↩ Undo</button><button class="chip" data-t="erase">⌫ Erase</button><button class="chip" data-t="hint">💡 Hint</button></div>
      <p class="sub small center" style="margin:6px 0 0">Tap a square, then a number. Soft colour means it doesn’t fit yet. ${opts.pause!==false?'Your puzzle is saved if you stop.':''}</p>`};
    const push=i=>{p.hist.push({i,v:p.grid[i],nt:p.notes[i].slice()});if(p.hist.length>200)p.hist.shift()};
    const after=()=>{save();draw();if(p.grid.every((v,i)=>v===p.sol[i])){p.solved=true;save();setTimeout(()=>solved(p),350)}};
    box.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.c!=null){p.sel=+b.dataset.c;draw();return}
      if(b.dataset.v){const i=p.sel;if(i==null||p.given[i]){toast('Tap an empty square first');return}const v=+b.dataset.v;push(i);
        if(p.noteMode&&!p.grid[i]){const nt=p.notes[i];p.notes[i]=nt.includes(v)?nt.filter(x=>x!==v):nt.concat(v).sort()}
        else{p.grid[i]=p.grid[i]===v?0:v;p.notes[i]=[];if(p.grid[i]===p.sol[i]){const r=Math.floor(i/n),c=i%n,[br2,bc2]=SDK_BOX[n];p.notes.forEach((nt,j)=>{const rj=Math.floor(j/n),cj=j%n;if(nt.includes(v)&&(rj===r||cj===c||(Math.floor(rj/br2)===Math.floor(r/br2)&&Math.floor(cj/bc2)===Math.floor(c/bc2))))p.notes[j]=nt.filter(x=>x!==v)})}}
        after();return}
      if(b.dataset.t==='notes'){p.noteMode=!p.noteMode;save();draw();return}
      if(b.dataset.t==='undo'){const h=p.hist.pop();if(h){p.grid[h.i]=h.v;p.notes[h.i]=h.nt;p.sel=h.i}save();draw();return}
      if(b.dataset.t==='erase'){const i=p.sel;if(i==null||p.given[i])return;push(i);p.grid[i]=0;p.notes[i]=[];after();return}
      if(b.dataset.t==='hint'){let i=p.sel;if(i==null||p.given[i]||p.grid[i]===p.sol[i]){const wrong=p.grid.map((v,j)=>v&&v!==p.sol[j]?j:-1).filter(j=>j>=0);const empty=p.grid.map((v,j)=>!v?j:-1).filter(j=>j>=0);i=(wrong.length?wrong:empty)[0]}
        if(i==null||i<0)return;push(i);p.grid[i]=p.sol[i];p.notes[i]=[];p.sel=i;p.hints++;toast('Here’s one');after();return}};
    draw()};
  const solved=p=>{S.sudoku=null;save();
    box.innerHTML=`<div class="center sdkwin"><div class="sdkpl" id="sdkpl">${plant(S.grow.stage,{wave:true,face:'smiley'})}</div><h2>Solved!</h2><p class="sub">${esc(sdkLabel(p))}${p.hints?` · ${p.hints} hint${p.hints===1?'':'s'}`:' · no hints'}</p></div>`;
    confettiAt(innerWidth/2,innerHeight*.35,34);buzz([15,60,15]);setTimeout(()=>{if(opts.onSolved)opts.onSolved(p)},1500)};
  if(opts.resume&&S.sudoku&&!S.sudoku.solved)play(S.sudoku);else chooser();
}

/* ================= Respect mornings: getting-ready time, shop hours, preferred time of day ================= */
function workSpan(k){const w=routinesOn(k).filter(r=>r.e-r.s>=240&&r.rkind!=='routine');if(!w.length)return null;return{s:Math.min(...w.map(r=>r.s)),e:Math.max(...w.map(r=>r.e))}}
const hasWorkRoutine=()=>(S.routines||[]).some(r=>r.start&&r.end&&r.kind!=='task'&&r.kind!=='routine'&&toMin(r.end)-toMin(r.start)>=240&&!r.paused);
function isWorkday(k){if(workSpan(k))return true;if(hasWorkRoutine())return false;const d=parseDK(k).getDay();return d>=1&&d<=5}
function readyWin(k){const ov=(S.readyOver||{})[k];if(ov)return ov.e>ov.s?{s:ov.s,e:ov.e}:null;const rd=S.settings.ready||{},ws=workSpan(k);const end=rd.end?toMin(rd.end):ws?ws.s:540;const start=rd.start?toMin(rd.start):Math.max(0,end-120);return end>start?{s:start,e:end}:null}
function readyOn(k){if((S.settings.ready||{}).on===false||!isWorkday(k))return [];const w=readyWin(k);if(!w)return [];
  return freeGaps(w.s,w.e,routinesOn(k)).filter(g=>g.e-g.s>=5).map(g=>({s:g.s,e:g.e,kind:'busy',title:'Getting ready',rid:'ready',date:k,ready:true}))}

const SHOP_RE=/\b(buy|pick up|collect|shop|shopping|groceries|supermarket|pharmacy|chemist|drogist|post office|hardware store|kruidvat|albert heijn|action|hema|ikea)\b|\bget\b.*\bfrom (the )?\w+/i;
const shopHours=()=>({s:toMin((S.settings.shopHours||{}).start||'09:00'),e:toMin((S.settings.shopHours||{}).end||'18:00')});
function isShopItem(i){if(!i)return false;if(i.shopReq===false)return false;const t=(i.title||'')+' '+(i.steps||[]).map(s=>s.title||'').join(' ');return !!(i.shopReq||(i.shop&&i.shop.length&&i.out!==false&&/\b(buy|get|pick up|shop)\b/i.test(i.title||''))||(SHOP_RE.test(i.title||'')&&!/\bonline\b/i.test(t)))}
const PREF_WIN={morning:[0,720],afternoon:[720,1020],evening:[1020,1440]};
/* Limits for where a task may go on day k. */
function slotLimits(k,i){if(!i)return null;let lo=0,hi=1440;const pref=i.pref&&i.pref!=='any'?i.pref:null;
  if(pref){lo=Math.max(lo,PREF_WIN[pref][0]);hi=Math.min(hi,PREF_WIN[pref][1])}
  if(i.noMorning)lo=Math.max(lo,720);
  if(i.noUnusual){lo=Math.max(lo,540);let bt=toMin(S.settings.bedtime||'23:00');if(bt<300)bt=1425;hi=Math.min(hi,Math.min(1320,bt-60));const ws=workSpan(k);if(ws&&lo<ws.s&&ws.s-lo<=30)lo=ws.e}
  if(isShopItem(i)){const sh=shopHours();lo=Math.max(lo,sh.s);hi=Math.min(hi,sh.e);const ws=workSpan(k);if(ws&&ws.e<sh.e-15)lo=Math.max(lo,ws.e)}
  return{lo,hi}}
/* Why a slot is unusual (or null). */
function unusualWhy(k,s,e,i){const pref=i&&i.pref;
  if(s<540&&pref!=='morning')return 'early in the morning';

function rtFromTpl(key,sched){const t=RT_TPL.find(x=>x[0]===key);if(!t)return null;const steps=t[3].map(([title,minutes])=>({title,minutes})),tot=rtTotal(steps);

/* Routine steps are already small, so: Medium = as written, Tiny = longer ones split further, Overview = 2–3 chunks. */
function rtSteps(r){const base=(r.steps||[]).map(s=>({id:uid(),title:s.title,minutes:s.minutes||1,energy:'low',done:false})),lv=LV();

function gusHead(cx,cy,R,tilt){const e=r1,s=R/30;
  const ear=sd=>`<path d="M${e(cx+sd*R*.62)} ${e(cy-R*.62)} C${e(cx+sd*R*1.25)} ${e(cy-R*.6)} ${e(cx+sd*R*1.3)} ${e(cy+R*.35)} ${e(cx+sd*R*1.02)} ${e(cy+R*.62)} C${e(cx+sd*R*.8)} ${e(cy+R*.75)} ${e(cx+sd*R*.62)} ${e(cy+R*.3)} ${e(cx+sd*R*.7)} ${e(cy-R*.1)} Z" fill="${GUS.dark}" stroke="${GUS.line}" stroke-width="${r1(1.8*s)}" stroke-linejoin="round"/>`;

    <ellipse cx="${cx}" cy="${e(cy+R*.42)}" rx="${e(R*.56)}" ry="${e(R*.4)}" fill="${GUS.cream}"/>`}
function gusFaceExtra(cx,ey,es){const f=CUR_FACE,s=v=>r1(v*es);

  return nose+tongue}
const STICK=(x,y)=>`<g class="gstick"><path d="M${r1(x-14)} ${r1(y)} L${r1(x+14)} ${r1(y-3)}" stroke="#8E6B43" stroke-width="3.4" stroke-linecap="round"/><path d="M${r1(x+6)} ${r1(y-2)} l3 -5" stroke="#8E6B43" stroke-width="2" stroke-linecap="round"/></g>`;

const APP_VERSION='2026.11.19 · maps 2';
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsDT=(k,m)=>k.replace(/-/g,'')+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';
const icsStamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
function icsFold(l){const out=[];while(l.length>60){out.push(l.slice(0,60));l=" "+l.slice(60)}out.push(l);return out.join('\r\n')}
function icsEvent(o){/* o:{uid,title,date,s,e,remind,rrule,desc} — local "floating" times so they follow the phone's time zone */
  const L=['BEGIN:VEVENT','UID:'+o.uid+'@tend','DTSTAMP:'+icsStamp(),'DTSTART:'+icsDT(o.date,o.s),'DTEND:'+icsDT(o.date,Math.min(1439,Math.max(o.e,o.s+5))),'SUMMARY:'+icsEsc(o.title),'DESCRIPTION:'+icsEsc(o.desc||'Planned in Tend')];
  if(o.rrule)L.push(o.rrule);
  const m=remMinutes(o.remind,o.date,o.s);if(m!=null)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(o.title),'TRIGGER:-PT'+Math.max(0,Math.round(m))+'M','END:VALARM');
  L.push('END:VEVENT');return L.map(icsFold).join('\r\n')}
const icsWrap=evs=>['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tend//Planner//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',...evs,'END:VCALENDAR'].join('\r\n')+'\r\n';
function blockEv(b){const t=b.taskId?S.tasks.find(x=>x.id===b.taskId):null;return{uid:'b-'+b.id,title:b.title,date:b.date,s:b.s,e:b.e,remind:b.remind!=null?b.remind:t&&t.remind!=null?t.remind:undefined,desc:t&&t.steps.length>1?'Steps: '+t.steps.filter(s=>!s.done&&(b.stepIds||[]).includes(s.id)).map(s=>s.title).join(', '):'Planned in Tend'}}
function routineEv(r){const k=firstOccFrom(r,r.anchor||dkey())||dkey(),s=toMin(r.start),e=toMin(r.end||r.start);
  return{uid:'r-'+r.id,title:r.title,date:k,s,e:Math.max(e,s+5),remind:r.kind==='routine'||r.kind==='task'?r.remind:(r.remind==null?'none':r.remind),rrule:rruleOf(r),desc:r.kind==='routine'?'Routine in Tend: '+(r.steps||[]).map(x=>x.title).join(', '):'Planned in Tend'}}
async function addToPhone(evs,name,mark){if(!evs.length){toast('Nothing to add yet');return}
  const data=icsWrap(evs.map(icsEvent)),fn=`${(name||'tend-plans').replace(/[^\w-]+/g,'-').toLowerCase()}.ics`;let ok=false;
  try{if(DL){await DL.save({filename:fn,data});ok=true}}catch(e){if(e&&(e.code==='declined'||e.code==='cancelled'||e.name==='AbortError'))return}
  if(!ok){try{const f=new File([data],fn,{type:'text/calendar'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Add to calendar'});ok=true}}catch(e){if(e&&e.name==='AbortError')return}}
  if(!ok){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/calendar'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();ok=true}catch(e){}}

function icsHelp(n){try{$('#toast').classList.remove('on')}catch(e){}openSheet(`<div class="center"><div style="font-size:42px">📲</div><h1 style="font-size:24px">Calendar file ready</h1><p class="sub">Open it and tap <b>Add${n>1?' All':''}</b>. ${n===1?'It goes':'They go'} into your phone’s calendar with ${n===1?'its':'their'} reminder${n===1?'':'s'}, so your phone reminds you even when Tend is closed.</p>
  <p class="sub small">iPhone: open the downloaded file (Files or the download arrow in Safari) → Add${n>1?' All':''}. Android: open it with Google Calendar.</p><p class="sub small">If you move or delete it in Tend later, I’ll remind you to change it in your calendar too.</p><button class="btn mauve block" data-close>Got it</button></div>`,el=>{el.onclick=e=>{if(btnOf(e))closeSheet()}})}
const icsAddBlocks=bs=>addToPhone(bs.map(blockEv),bs.length===1?bs[0].title:'tend-plans',()=>bs.forEach(b=>b.ics=true));

function feedbackSheet(at){const d=S.fbDraft=S.fbDraft&&S.fbDraft.v===2?S.fbDraft:{v:2};let i=at!=null?at:(d.at||0);const N=FB_STEPS.length;
  const ta=(k,ph,rows)=>`<textarea data-fq="${k}" rows="${rows||4}" maxlength="2000" placeholder="${ph||'Type or talk…'}">${esc(d[k]||'')}</textarea>`;
  const dots=()=>`<div class="fbdots" aria-label="Question ${i+1} of ${N}">${FB_STEPS.map((_,j)=>`<i class="${j<i?'done':j===i?'on':''}"></i>`).join('')}<i class="${i>=N?'on':''}"></i></div>`;
  const body=()=>{if(i>=N)return `<div class="center fbend">${plant(S.grow.stage,{cls:'fbcheer',face:'smiley',idle:true})}<h1 style="font-size:26px;margin:6px 0 0">Thank you so much!</h1><p class="sub">Tap send to share it with ${esc(OWNER_NAME||'your friend')} 💜</p></div>
      <label class="lbl" for="fb_name">Your name (optional)</label><input type="text" id="fb_name" data-fq="name" value="${esc(d.name||'')}" maxlength="40">

    const q=FB_STEPS[i];let h=`<div class="k">Question ${i+1} of ${N} · all optional</div><h1 style="font-size:25px;margin:4px 0 2px">${esc(q.q)}</h1>${q.sub?`<p class="sub">${esc(q.sub)}</p>`:''}`;
    if(q.type==='text')h+=ta(q.k);
    else if(q.type==='chips'){const v=d[q.k]||[];h+=`<div class="chips">${q.opts.map(o=>`<button type="button" class="chip ${v.includes(o)?'on':''}" data-fm="${q.k}" data-v="${esc(o)}">${v.includes(o)?'✓ ':''}${o}</button>`).join('')}</div><label class="lbl">Other</label>${ta(q.k+'_o','Something else?',2)}`}
    else if(q.type==='one')h+=`<div class="fbone">${q.opts.map(o=>`<button type="button" class="btn ${d[q.k]===o?'mauve':'cream'} block" data-fo="${q.k}" data-v="${esc(o)}">${o}</button>`).join('')}</div>`;
    else if(q.type==='two'){h+=`<div class="lbl">Most useful</div><div class="chips">${FB_FEAT.map(([k,l])=>`<button type="button" class="chip ${d.most===k?'on':''}" data-f2="most" data-v="${k}">${l}</button>`).join('')}</div><div class="lbl">Least useful</div><div class="chips">${FB_FEAT.map(([k,l])=>`<button type="button" class="chip ${d.least===k?'on':''}" data-f2="least" data-v="${k}">${l}</button>`).join('')}</div>`}
    else if(q.type==='vis')h+=`<div class="chips">${FB_VIS.map(v=>`<button type="button" class="chip ${d.vis===v?'on':''}" data-fo="vis" data-v="${esc(v)}">${v}</button>`).join('')}</div><label class="lbl">What would make it feel more “you”?</label>${ta('visyou','Colours, characters, anything…',3)}`;
    else if(q.type==='bugs')h+=ta('bugs','What happened, and on which screen?',4)+`<label class="btn cream block fbshot"><input type="file" accept="image/*" id="fbImg" hidden>${FB_SHOT?'✓ '+esc(FB_SHOT.name):'📷 Add a screenshot'}</label>`;
    if(q.type==='text'||q.type==='vis'||q.type==='bugs'||q.type==='chips')h+=`<p class="sub small fbhint">🎙 Tip: tap the microphone on your keyboard to talk instead of typing.</p>`;
    return h};
  const draw=()=>`${dots()}${body()}<div class="fbnav">${i>0?'<button class="btn ghost" data-fb="back">← Back</button>':'<span></span>'}${i<N?`<button class="link" data-fb="skip">Skip</button><button class="btn mauve" data-fb="next">${i===N-1?'Finish':'Next →'}</button>`:''}</div><button class="link block fbsave" data-close>Save and finish later</button>`;
  openSheet(draw(),el=>{const redraw=()=>{d.at=i;save();el.innerHTML='<div class="grab"></div>'+draw();el.scrollTop=0};
    el.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.fq;if(k){d[k]=e.target.value;save()}});
    el.addEventListener('change',e=>{if(e.target.id==='fbImg'){FB_SHOT=e.target.files&&e.target.files[0]||null;redraw()}});
    el.onclick=async e=>{const b=btnOf(e);if(!b)return;
      if(b.dataset.fb==='next'||b.dataset.fb==='skip'){i=Math.min(N,i+1);redraw();if(i>=N){setTimeout(()=>confettiAt(innerWidth/2,innerHeight*.3,30),250);pipHop()}}
      else if(b.dataset.fb==='back'){i=Math.max(0,i-1);redraw()}
      else if(b.dataset.fm){const k=b.dataset.fm,v=b.dataset.v;d[k]=d[k]||[];d[k]=d[k].includes(v)?d[k].filter(x=>x!==v):d[k].concat(v);redraw()}
      else if(b.dataset.fo){d[b.dataset.fo]=d[b.dataset.fo]===b.dataset.v?null:b.dataset.v;redraw()}
      else if(b.dataset.f2){d[b.dataset.f2]=d[b.dataset.f2]===b.dataset.v?null:b.dataset.v;redraw()}
      else if(b.hasAttribute('data-fcopy')){const ok=await copyText(fbText());toast(ok?'Copied. Paste it into WhatsApp, email or a message.':'Couldn’t copy. Long-press the text instead.');if(!ok)fbShowText(el)}
      else if(b.hasAttribute('data-fsend')){const text=fbText();let sent=false;
        try{if(navigator.share){const data={title:'Tend feedback',text};if(FB_SHOT&&navigator.canShare&&navigator.canShare({files:[FB_SHOT]}))data.files=[FB_SHOT];await navigator.share(data);sent=true}}catch(err){if(err&&err.name==='AbortError')return}
        if(!sent){const ok=await copyText(text);fbShowText(el,ok);return}
        fbDone()}
      else if(b.hasAttribute('data-close')){d.at=i;save();closeSheet();toast('Saved. Carry on any time from Settings.')}}});}
function fbText(){const d=S.fbDraft||{},L=[],fl=k=>(FB_FEAT.find(f=>f[0]===k)||[0,k])[1];const add=(q,a)=>{if(a&&String(a).trim())L.push(`${q}\n${String(a).trim()}`)};
  L.push(`💬 Tend feedback${d.name?' from '+d.name:''}`);
  add('1. First impression: what did you think Tend was for?',d.first);
  add('2. A moment Tend helped',d.helped);
  add('3. A moment you felt stuck, confused or annoyed',d.stuck);
  add('4. How it made you feel',[(d.feel||[]).join(', '),d.feel_o].filter(x=>x&&String(x).trim()).join(' · '));
  add('5. I like…',d.like);add('6. I wish…',d.wish);add('7. What if…',d.whatif);
  add('8. Most / least useful',d.most||d.least?`Most: ${d.most?fl(d.most):'-'} · Least: ${d.least?fl(d.least):'-'}`:'');
  add('9. Visuals',[d.vis,d.visyou].filter(x=>x&&String(x).trim()).join('\nMore “me”: '));
  add('10. How often opened',d.often);add('11. If Tend disappeared',d.gone);
  add('12. Glitches or bugs',(d.bugs||'')+(FB_SHOT?'\n📷 Screenshot attached':''));
  add('13. Up for a 15-min chat',d.chat);
  L.push(`—\nTend ${APP_VERSION} · ${phoneType()} · ${new Date().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}`);
  return L.join('\n\n')}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();const ok=document.execCommand('copy');x.remove();return ok}catch(e2){return false}}}
function fbShowText(el,copied){const t=fbText();el.innerHTML=`<div class="grab"></div><h1 style="font-size:24px">Almost done</h1><p class="sub">${copied?'It’s copied. Paste it into WhatsApp, a message or an email to '+esc(ownerName())+'.':'Copy this and send it to '+esc(ownerName())+'.'}</p>
  <textarea rows="12" readonly style="font-size:13px">${esc(t)}</textarea><a class="btn cream block mt" href="mailto:?subject=${encodeURIComponent('Tend feedback')}&body=${encodeURIComponent(t)}" target="_blank" rel="noopener">✉️ Open in email</a><a class="btn cream block" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">💬 Open in WhatsApp</a><button class="btn mauve block" data-fdone>Done</button>`;
  el.onclick=e=>{const b=btnOf(e);if(b&&b.hasAttribute('data-fdone'))fbDone()}}
function fbDone(){const d=S.fbDraft;(S.feedback=S.feedback||[]).push({at:Date.now(),text:fbText()});S.fbDraft={v:2};S.fbSent=Date.now();FB_SHOT=null;save();closeSheet();render();confettiAt(innerWidth/2,innerHeight*.4,24);toast('Thank you! That really helps 💜')}
/* Track days of use, for the gentle prompt after 3 days */
function fbUseDay(){if(!TESTER||!S)return;const k=dkey();S.useDays=S.useDays||[];if(!S.useDays.includes(k)){S.useDays.push(k);S.useDays=S.useDays.slice(-30);save()}}
function fbPromptHTML(){if(!TESTER||S.fbSent||S.fbNever)return '';if((S.useDays||[]).length<3)return '';if(S.fbLater&&S.fbLater>dkey())return '';
  return `<section class="card fbp slide"><span style="font-size:30px">💬</span><span style="flex:1"><b>Got 2 minutes to tell ${esc(OWNER_NAME||'your friend')} what you think?</b><span class="sub small" style="display:block;margin:2px 0 0">Every answer is optional.</span>
    <span class="fbpb"><button class="btn peach" data-act="fbopen">Give feedback</button><button class="link" data-act="fblater">Later</button><button class="link" data-act="fbnever">Don’t ask again</button></span></span></section>`}

/* ================= Endless growth: My garden, lifetime ✦ unlocks, colours, monthly items ================= */
const lifeEarned=()=>Math.max(0,Math.round((S&&S.grow&&S.grow.lifetime)||0));
/* Everything unlockable, in order, once each. Companions not in the list are added at the end so nothing stays locked forever. */
const SEQ_U=(()=>{const seen=new Set(),out=[];UNLOCK_SEQ.forEach(([k,id])=>{const key=k+':'+id;if(!seen.has(key)){seen.add(key);out.push([k,id])}});
  CHAR_ORDER.forEach(id=>{if(!START_CHARS.includes(id)&&!seen.has('char:'+id)){seen.add('char:'+id);out.push(['char',id])}});return out})();
/* Lifetime ✦ milestones: the first comes quickly, then a little further apart each time. */
const MILE=i=>Math.round((150+120*i+3*i*(i-1))/10)*10;
const VARS=[[0,'Classic'],[38,'Sunset'],[150,'Mint'],[205,'Sky'],[275,'Berry'],[325,'Rose']];
/* After the list is done, a new colour every 300 ✦, cycling through the companions, so there's always something next. */
const VAR_LIST=(()=>{const out=[];for(let v=1;v<VARS.length;v++)CHAR_ORDER.forEach(t=>out.push([t,v]));return out})();
const VAR0=()=>MILE(SEQ_U.length);
const varAt=j=>VAR0()+300*j;
function varsOf(t){const u=unl();u.vars=u.vars||{};const s=new Set([0].concat(u.vars[t]||[]));(S.garden||[]).forEach(g=>{if(g.type===t)s.add(g.variant||0)});if(S.companion.type===t)s.add(S.companion.variant||0);return [...s].sort((a,b)=>a-b)}
function addVar(t,v){if(!v)return;const u=unl();u.vars=u.vars||{};u.vars[t]=u.vars[t]||[];if(!u.vars[t].includes(v))u.vars[t].push(v)}
function grant(k,id,v){const u=unl();if(k==='char'){if(!u.chars.includes(id))u.chars.push(id)}else if(k==='bg'){if(!u.bgs.includes(id))u.bgs.push(id)}else if(k==='var')addVar(id,v);else{if(!u.items.includes(id))u.items.push(id);if(!S.wardrobe.owned.includes(id))S.wardrobe.owned.push(id)}}
function grantUnlock(){const nx=remainingSeq()[0];if(!nx)return null;grant(nx[0],nx[1]);return{k:nx[0],id:nx[1]}}
/* ✦ earned (in total) at which something unlocks */
function unlockAt(k,id){if(isUnl(k,id))return null;const i=SEQ_U.findIndex(x=>x[0]===k&&x[1]===id);return i<0?null:MILE(i)}
function checkUnlocks(silent){if(!S||!S.grow)return[];const life=lifeEarned(),got=[];
  SEQ_U.forEach(([k,id],i)=>{if(MILE(i)<=life&&!isUnl(k,id)){grant(k,id);got.push({k,id})}});
  VAR_LIST.forEach(([t,v],j)=>{if(varAt(j)<=life&&!varsOf(t).includes(v)){grant('var',t,v);got.push({k:'var',id:t,v})}});
  if(got.length&&!silent)queueCeleb({type:'unlock',list:got});return got}
function nextUnlock(){const life=lifeEarned();let prev=0,nx=null;
  SEQ_U.forEach(([k,id],i)=>{const m=MILE(i);if(m<=life)prev=Math.max(prev,m);else if(!isUnl(k,id)&&(!nx||m<nx.at))nx={at:m,u:{k,id}}});
  if(!nx)VAR_LIST.some(([t,v],j)=>{const m=varAt(j);if(m<=life){prev=Math.max(prev,m);return false}if(!varsOf(t).includes(v)){nx={at:m,u:{k:'var',id:t,v}};return true}return false});
  if(!nx)return null;nx.prev=prev;nx.left=nx.at-life;nx.pct=Math.max(2,Math.min(100,Math.round((life-prev)/Math.max(1,nx.at-prev)*100)));return nx}
const unlName=x=>x.k==='char'?CHARS[x.id].label:x.k==='bg'?BGS[x.id][0]+' background':x.k==='var'?`${VARS[x.v][1]} ${CHARS[x.id].label.toLowerCase()}`:ITEMS[x.id].name;
const unlKind=u=>u.k==='char'?'A new companion to grow':u.k==='bg'?'A new home background':u.k==='var'?'A new colour':ITEMS[u.id].scene?'A scene for Today':'A special item, never in the shop';
function unlArt(x,locked){const cls=locked?'sil':'';
  if(x.k==='char')return `<span class="ua ${cls}">${plant(6,{type:x.id,wave:false,outfit:[],lv:1,noExtras:true,variant:x.id===S.companion.type&&!locked?(S.companion.variant||0):((S.companion.vmap||{})[x.id]||0)})}</span>`;
  if(x.k==='var')return `<span class="ua ${cls}">${plant(6,{type:x.id,wave:false,outfit:[],lv:1,noExtras:true,variant:x.v})}</span>`;
  if(x.k==='bg')return `<span class="ua bgprev bg-${x.id} ${cls}"><b>${BGS[x.id][1]}</b></span>`;
  return `<span class="ua art ${cls}">${artSVG(x.id)}</span>`}

/* Colour variants: rotate the hue of the companion's own colours (not the outlines, eyes, cheeks or outfits). */
const RC={},RC_KEEP=new Set(['#efafba','#ffffff','#fff']);
function rotHex(hex,deg){let h=hex.slice(1).toLowerCase();if(RC_KEEP.has(hex.toLowerCase()))return hex;if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  if(d<.07||l<.22)return hex;const s=d/(1-Math.abs(2*l-1));let H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H=((H*60+deg)%360+360)%360;
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((H/60)%2-1)),m=l-c/2,[R,G,B]=H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x];
  return '#'+[R,G,B].map(v=>Math.max(0,Math.min(255,Math.round((v+m)*255))).toString(16).padStart(2,'0')).join('')}
function recolor(svg,v){const deg=(VARS[v]||VARS[0])[0];if(!deg)return svg;return svg.replace(/#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b/g,m=>{const k=m+deg;return RC[k]||(RC[k]=rotHex(m,deg))})}

/* ---- A growing season: what happened while this companion grew ---- */
function cycStart(){S.grow.cyc=S.grow.cyc||{start:dkey(),tasks:0,hob:{}};return S.grow.cyc}
function trackDone(reason){try{if(!S||!S.grow)return;const c=cycStart();if(/^Finished: /.test(reason))c.tasks++;else if(/^Hobby: /.test(reason)){const n=reason.slice(7);c.hob[n]=(c.hob[n]||0)+1}}catch(e){}}
const favOf=h=>{const e=Object.entries(h||{}).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:null};
const nextVar=t=>(S.garden||[]).filter(g=>g.type===t).length%VARS.length;
function bloom(){const G=goalXP(),c=cycStart(),t=S.companion.type;
  const e={id:uid(),type:t,name:petName(),variant:S.companion.variant||0,up:!!S.grow.upLook,started:c.start,bloomed:dkey(),tasks:c.tasks,fav:favOf(c.hob),outfit:Object.entries(S.wardrobe.equipped).filter(([k])=>k!=='scene').map(([,v])=>v)};
  (S.garden=S.garden||[]).push(e);
  S.grow.levelBase=(S.grow.levelBase||0)+G;S.grow.stage=0;S.grow.upLook=false;S.grow.level=(S.grow.level||1)+1;S.grow.cyc={start:dkey(),tasks:0,hob:{}};
  S.companion.variant=nextVar(t);addVar(t,S.companion.variant);return e}
function afterProgress(){
  const x=lvXP(),G=goalXP();
  if(x>=G){if(S.grow.stage<9){S.grow.stage=9;queueCeleb({type:'grow',stage:9,variant:S.companion.variant||0,lv:lvl()})}let n=0;while(lvXP()>=goalXP()&&n++<5){const e=bloom();queueCeleb({type:'bloom',entry:e})}save()}
  else{const s=stage10For(x);if(s>S.grow.stage){S.grow.stage=s;const gift=s%2===0?pickGift(Math.floor(s/2)):null;if(gift)S.wardrobe.owned.push(gift);save();queueCeleb({type:'grow',stage:s,gift})}}
  if(checkUnlocks().length)save();
  if(todayStops()>=goal()&&S.homeDay!==dkey()){S.homeDay=dkey();save();queueCeleb({type:'home'})}
}
const gPlant=(e,o={})=>plant(9,Object.assign({type:e.type,variant:e.variant||0,lv:e.up?2:1,outfit:(e.outfit||[]).filter(id=>ITEMS[id]),wave:false,label:e.name},o));
function bloomCelebHTML(c){const e=c.entry,n=esc(e.name);
  return `<div class="k">Fully grown!</div>${gPlant(e,{cls:'cpip',face:'smiley'})}<h1>${n} joins your garden!</h1><p>${n} is planted in My garden for good, and a new seedling is ready to grow with you. Your garden grows forever.</p>
  <div class="nextpick"><span class="ua">${plant(5,{type:S.companion.type,variant:S.companion.variant||0,lv:1,wave:false,outfit:[],noExtras:true})}</span><span><b>Next up: ${esc(petName())} again</b><span class="sub small" style="display:block;margin:0">With a new look: ${esc(VARS[S.companion.variant||0][1].toLowerCase())}</span></span></div>`}
function unlockCelebHTML(c){const L=c.list,nx=nextUnlock();
  return `<div class="k">Something new</div><div class="unlks ${L.length>1?'many':''}">${L.slice(0,3).map(u=>`<div class="unlk">${unlArt(u)}<b>${esc(unlName(u))}</b><span class="sub small">${unlKind(u)}</span></div>`).join('')}</div>${L.length>3?`<p class="sub small">…and ${L.length-3} more</p>`:''}
  <h1>${L.length>1?`${L.length} new things unlocked!`:'Unlocked!'}</h1><p>You’ve earned ${lifeEarned()} ✦ in total. Spending never counts against this.${nx?` Next surprise at ${nx.at} ✦.`:''}</p>`}

/* Who grows next */
function seedPick(after){const done=()=>{if(after)setTimeout(after,450)};const chars=CHAR_ORDER.filter(t=>isUnl('char',t));let sel=S.companion.type;

const nextVarFor=t=>t===S.companion.type?(S.companion.variant||0):nextVar(t);

  if(!s.garden.length)hall.forEach(h=>{s.garden.push({id:uid(),type:t,name:nm,variant:0,up:(h.level||2)>2,started:prev,bloomed:h.date||dkey(),tasks:null,fav:null,outfit:[],old:true});prev=h.date||prev});

  const since=prev,hob={};let tasks=0;(s.ledger||[]).forEach(l=>{if(l.points<=0||!l.reason)return;if(since&&dkey(new Date(l.at))<since)return;if(/^Finished: /.test(l.reason))tasks++;else if(/^Hobby: /.test(l.reason)){const n=l.reason.slice(7);hob[n]=(hob[n]||0)+1}});
  s.grow.cyc=s.grow.cyc||{start:since||dkey(),tasks,hob}}

const CAL={};

function createdId(r){const p=r&&(r.payload!==undefined?r.payload:r);
  if(p&&typeof p==='object'){const v=p.id||p.eventId||p.event_id||(p.event&&p.event.id)||(p.result&&p.result.id);return v?String(v):null}
  if(typeof p==='string'){try{return createdId({payload:JSON.parse(p)})}catch(e){}const m=p.match(/"?(?:event_?id|id)"?\s*[:=]\s*"?([A-Za-z0-9_\-]{6,})/i);return m?m[1]:null}
  return null}
async function deleteEventInput(id){const p=propsOf(await schemaOf('delete_event'));
  if(!Object.keys(p).length)return{calendarId:'primary',eventId:id};
  const inp={},kId=pick(p,[/event_?id/i,/^id$/i]);inp[kId||'eventId']=id;const kC=pick(p,[/calendar_?id/i]);if(kC)inp[kC]='primary';return inp}
const tendTitle=b=>b.kind==='task'?`Tend · ${b.title}`:b.title;
/* Finds the Google event for a Tend plan. Only ever returns an event Tend made:
   one whose id Tend saved when creating it, or (older plans) an exact “Tend · title” event at the same time. */
async function findTendEvent(b){
  if(!MCP)return{err:'Calendar access isn’t available in this view.'};
  const r=await fetchEvents(b.date,addDays(b.date,1));
  if(r.state!=='ok')return{err:r.msg||'I couldn’t read Google Calendar.'};
  const evs=r.events;
  if(b.gid){const ev=evs.find(e=>e.id===b.gid);if(!ev)return{gone:true};
    if(ev.title!==tendTitle(b)&&ev.title!==`Tend · ${b.title}`)return{notTend:true};return{id:ev.id}}
  const ev=evs.find(e=>e.title===`Tend · ${b.title}`&&e.id&&Math.abs(((e.start-parseDK(b.date).getTime())/60000)-b.s)<=1);
  return ev?{id:ev.id}:{gone:true};
}
async function gDelete(id){await MCP.callTool(GCAL,'delete_event',await deleteEventInput(id))}
async function gCreate(b){const t=b.taskId?S.tasks.find(x=>x.id===b.taskId):null,v=b.remind!=null?b.remind:t&&t.remind!=null?t.remind:undefined;const r=await MCP.callTool(GCAL,'create_event',await createEventInput(tendTitle(b),'Planned in Tend'+(remMinutes(v,b.date,b.s)!=null?` · alert: ${remLabel(v).toLowerCase()}`:''),atDK(b.date,b.s),atDK(b.date,b.e),{remind:remMinutes(v,b.date,b.s)}));return createdId(r)}
function setStepTimes(b,clear){if(!b.taskId)return;const t=S.tasks.find(x=>x.id===b.taskId);if(!t)return;let m=b.s;(b.stepIds||[]).forEach(id=>{const s=t.steps.find(x=>x.id===id);if(!s)return;s.at=clear?null:atDK(b.date,m).getTime();m+=s.minutes})}
function calOcc(k,except){
  const own=except&&except.date===k?except:null;
  const ev=eventsOn(k,calEventsOn(k).filter(e=>!(own&&(e.id&&e.id===own.gid||e.title===tendTitle(own)&&Math.abs(((e.start-parseDK(k).getTime())/60000)-own.s)<=1))));
  return busyOn(k).concat(ev).concat(blocksOn(k).filter(x=>x!==except))}

        if(b.cal&&b.gid&&MCP)askSheet('Update the alert in Google Calendar too?','Tend replaces its own event with one that has the new alert. Your other events are never touched.',[{label:'Yes, update it',v:'yes',cls:'peach'},{label:'Not now',v:'cancel',cls:'ghost'}]).then(async v=>{if(v!=='yes')return;closeSheet();try{await gDelete(b.gid)}catch(e){}try{b.gid=await gCreate(b);b.cal=!!b.gid}catch(e){b.cal=false}save();Object.keys(CAL).forEach(k=>delete CAL[k]);render();toast(b.cal?'Google alert updated':'Couldn’t update Google Calendar')});else toast('Reminder: '+remLabel(v).toLowerCase());return}check()};

function askSheet(title,body,btns){return new Promise(res=>{let done=false;
  openSheet(`<h1 style="font-size:25px">${title}</h1><p class="sub">${body}</p>${btns.map((b,i)=>`<button class="btn ${b.cls||'lav'} block" data-ans="${i}" ${i===0?'style="margin-top:16px"':''}>${b.label}</button>`).join('')}`,el=>{

async function confirmRemove(b){
  if(b.ics)icsNudge([b],'deleted');
  if(!b.cal){closeSheet();removeBlock(b);toast('Removed from your plan.','Undo',()=>{S.blocks.push(b);setStepTimes(b,false);save();render()});return}
  const v=await askSheet('Remove this plan?',`“${esc(tendTitle(b))}” is also in your Google Calendar on ${esc(dateLabel(b.date))} at ${fmt(b.s)}. Delete it there too?`,
    [{label:'Delete from Tend and Google',v:'both',cls:'mauve'},{label:'Only remove from Tend',v:'tend'},{label:'Cancel',v:'cancel',cls:'ghost'}]);
  if(v==='cancel')return;
  if(v==='tend'){closeSheet();removeBlock(b);toast('Removed from Tend. It’s still in Google Calendar.');return}
  busySheetMsg('Finding it in Google Calendar…');
  try{const f=await findTendEvent(b);
    if(f.err){closeSheet();toast(`${f.err} Nothing was deleted.`);return}
    if(f.notTend){closeSheet();removeBlock(b);toast('That Google event doesn’t look like Tend’s anymore, so I left it alone and removed the plan from Tend.');return}
    if(f.gone){closeSheet();removeBlock(b);toast('I couldn’t find it in Google Calendar (maybe already deleted). Removed from Tend.');return}
    const m=$('#busyMsg');if(m)m.textContent='Deleting it from Google Calendar…';
    await gDelete(f.id);closeSheet();removeBlock(b);delete CAL[ymOf(b.date)];render();toast('Removed from Tend and Google Calendar.');
  }catch(e){closeSheet();const c=calErr(e);toast(`${c.msg||'Couldn’t delete it from Google Calendar.'} Nothing was changed.`)}
}
function removeBlock(b){S.blocks=S.blocks.filter(x=>x!==b);setStepTimes(b,true);save();render()}
async function confirmMove(b,k,s){
  const dur=b.e-b.s,when=`${dateLabel(k)} at ${fmt(s)}`;
  if(!b.cal){applyMove(b,k,s);closeSheet();render();toast(`Moved to ${when}.`);return}
  const v=await askSheet('Move this plan?',`“${esc(tendTitle(b))}” is also in your Google Calendar. Move it there too, to ${esc(when)}?`,
    [{label:'Move in Tend and Google',v:'both',cls:'mauve'},{label:'Only move in Tend',v:'tend'},{label:'Cancel',v:'cancel',cls:'ghost'}]);
  if(v==='cancel')return;
  if(v==='tend'){applyMove(b,k,s);b.cal=false;b.gid=null;save();closeSheet();render();toast('Moved in Tend. The Google event stays at its old time.');return}
  busySheetMsg('Finding it in Google Calendar…');
  try{const f=await findTendEvent(b);
    if(f.err){closeSheet();toast(`${f.err} Nothing was moved.`);return}
    if(f.notTend){closeSheet();toast('That Google event doesn’t look like Tend’s anymore, so I didn’t touch it. Nothing was moved.');return}
    const m=$('#busyMsg');
    if(f.id){if(m)m.textContent='Removing the old time…';await gDelete(f.id)}
    const old={date:b.date};applyMove(b,k,s);b.cal=false;b.gid=null;save();
    if(m)m.textContent='Adding the new time…';
    try{b.gid=await gCreate(b);b.cal=true;save()}catch(e2){closeSheet();render();toast('Moved in Tend, and the old Google event was removed, but I couldn’t add the new one. Try moving it again later.');return}
    delete CAL[ymOf(old.date)];delete CAL[ymOf(k)];closeSheet();render();toast(f.gone?`Moved to ${when}. The old Google event was already gone, so I added a new one.`:`Moved to ${when} in Tend and Google Calendar.`);
  }catch(e){closeSheet();const c=calErr(e);toast(`${c.msg||'Couldn’t reach Google Calendar.'} Nothing was moved.`)}
}

function onTick(el){
  if(ui.busy)return;const a=el.dataset.act,t=S.tasks.find(x=>x.id===el.dataset.t);if(!t)return;
  if(a==='task'&&t.steps.length){ui.open.add(t.id);go('todos');return}
  const s=a==='step'?t.steps.find(x=>x.id===el.dataset.s):null;
  const isDone=a==='step'?s&&s.done:t.done;
  if(isDone){toast(`✓ “${a==='step'?s.title:t.title}” is done`,'Undo',()=>{if(a==='step')untickStep(t,s);else untickTask(t);save();render();toast('Undone. Points and progress taken back.')});return}
  const pts=a==='step'?stepPts(s,t):preview(stepBase({minutes:15},t)+S.settings.pts.taskBonus);
  ui.busy=true;el.classList.add('done','pop');floatFrom(el,pts);confettiFrom(el,14);pipHop();
  const card=el.closest('.task');const onToday=tab==='today';
  if(onToday&&card)setTimeout(()=>card.classList.add('leaving'),380);
  setTimeout(()=>{ui.busy=false;a==='step'?completeStep(t.id,s.id):completeTask(t.id)},onToday?720:460);
}
